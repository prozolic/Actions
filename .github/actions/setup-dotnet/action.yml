name: Setup .NET SDK.

inputs:
  dotnet-version:
    description: 'build .NET SDK version'
    required: false
    default: |
      8.0.x
      9.0.x
      10.0.x

runs:
  using: "composite"
  steps:
    - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Display .NET version
      shell: bash
      run: |
        echo "::group::Display .NET version"
          dotnet --version
        echo "::endgroup::"

    - name: Display installed .NET SDK version
      shell: bash
      run: |
        echo "::group::Display installed .NET SDK version"
          dotnet --list-sdks
        echo "::endgroup::"



